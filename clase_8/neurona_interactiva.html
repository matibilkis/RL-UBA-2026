<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neurona: mové w y b</title>
<style>
:root { --ink:#111; --bg:#fff; --muted:#666; --bad:#c0392b; --ok:#1e7e34; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ink:#eee; --bg:#111; --muted:#aaa; --bad:#ff6b5b; --ok:#5fd37a; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"STIX Two Text",Georgia,serif; }
.wrap { display:flex; flex-wrap:wrap; gap:32px; padding:24px 16px; max-width:1240px; margin:auto; align-items:flex-start; }
canvas { width:min(640px,100%); height:auto; aspect-ratio:1; border:1px solid #bbb; background:#fff; }
.panel { flex:1; min-width:300px; }
h1 { font-size:30px; margin:0 0 6px; font-weight:600; }
.sub { color:var(--muted); font-size:20px; margin:0 0 12px; }
label { display:flex; justify-content:space-between; font-size:28px; margin-top:20px; }
input[type=range] { width:100%; margin:6px 0 0; }
.val { font-variant-numeric:tabular-nums; }
.eq { font-size:26px; margin-top:24px; font-variant-numeric:tabular-nums; }
.count { font-size:46px; margin-top:24px; font-variant-numeric:tabular-nums; }
.count span { font-weight:700; }
.acc { font-size:26px; color:var(--muted); font-variant-numeric:tabular-nums; }
button { font:inherit; font-size:22px; padding:6px 14px; margin:20px 10px 0 0; cursor:pointer; }
.leyenda { font-size:20px; color:var(--muted); margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <canvas id="c" width="960" height="960"></canvas>
  <div class="panel">
    <h1>Mové la recta</h1>
    <p class="sub">80 puntos, dos clases. La neurona predice clase 1 si <i>w·x + b</i> &gt; 0.</p>
    <label><span>w<sub>1</sub></span><span class="val" id="v1"></span></label>
    <input id="s1" type="range" min="-5" max="5" step="0.1">
    <label><span>w<sub>2</sub></span><span class="val" id="v2"></span></label>
    <input id="s2" type="range" min="-5" max="5" step="0.1">
    <label><span>b</span><span class="val" id="vb"></span></label>
    <input id="sb" type="range" min="-5" max="5" step="0.1">
    <div class="eq" id="eq"></div>
    <div class="count">Mal clasificados: <span id="err"></span> de <span id="tot"></span></div>
    <div class="acc" id="acc"></div>
    <button id="r0">Valores iniciales</button><button id="r1">A ojo (1,5; 1,0; −0,5)</button>
    <div class="leyenda">Anillo negro = punto mal clasificado. Color de fondo = σ(w·x + b).</div>
  </div>
</div>
<script>
const D = {"X0": [[0.24, -3.3], [-1.22, -1.51], [-2.01, -1.19], [-3.42, -1.21], [-2.38, 1.99], [-1.4, -1.32], [-1.85, -1.6], [-2.55, -1.35], [-1.17, -1.21], [-0.74, -1.18], [-1.58, 0.39], [-1.11, -1.45], [-1.76, -0.51], [0.14, -1.24], [-1.82, -0.1], [-2.4, -1.26], [-0.81, -0.48], [-1.52, -0.4], [-4.15, -0.08], [-2.46, -2.5], [-1.35, -0.37], [-2.0, -1.97], [-1.58, -1.05], [-0.33, -0.33], [-1.43, 0.0], [-1.78, -1.83], [-1.07, -0.48], [-1.79, -1.7], [-1.39, -3.24], [-0.98, -0.56], [-3.07, -0.94], [-2.47, -0.32], [-3.43, -1.82], [-0.96, 0.04], [-3.54, -1.45], [-1.3, -1.55], [-0.17, -2.07], [-1.28, -1.94], [-0.33, -1.02], [-1.94, -2.55]], "X1": [[3.11, 1.88], [2.28, 2.22], [1.91, 0.62], [0.88, 0.48], [2.83, -0.11], [1.06, 0.91], [1.8, 1.72], [0.48, -0.36], [1.6, 2.29], [2.28, 1.39], [1.31, 1.46], [1.38, 1.94], [0.88, 1.32], [1.5, 1.69], [1.8, 3.5], [2.95, 2.55], [-0.24, 0.89], [1.05, 1.68], [-0.45, 2.26], [2.56, 0.03], [0.72, 0.48], [1.64, 1.78], [3.44, 1.02], [2.29, 1.34], [3.18, 1.87], [2.83, 0.23], [1.43, 0.47], [2.95, 1.79], [1.33, 0.79], [2.04, 0.57], [0.76, 1.63], [3.82, 0.98], [1.1, 0.15], [0.4, 1.67], [2.37, 1.21], [1.9, 1.3], [1.72, -0.17], [1.19, 1.3], [0.9, 0.77], [0.86, 0.9]]};
const pts = D.X0.map(p => ({x:p[0], y:p[1], c:0})).concat(D.X1.map(p => ({x:p[0], y:p[1], c:1})));
const R = 4;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const px = x => (x + R) / (2*R) * W;
const py = y => (R - y) / (2*R) * H;
const S = {s1:document.getElementById("s1"), s2:document.getElementById("s2"), sb:document.getElementById("sb")};
const INIT = [1.0, -0.5, -1.0];
const heat = document.createElement("canvas");
heat.width = heat.height = 80;
const hctx = heat.getContext("2d");

function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function cmap(s) {
  const lo = [59, 76, 192], mid = [221, 221, 221], hi = [180, 4, 38];
  return s < 0.5 ? mix(lo, mid, s / 0.5) : mix(mid, hi, (s - 0.5) / 0.5);
}
function fmt(v) { return v.toFixed(1).replace(".", ",").replace("-", "−"); }

function draw() {
  const w1 = +S.s1.value, w2 = +S.s2.value, b = +S.sb.value;
  ctx.clearRect(0, 0, W, H);

  const img = hctx.createImageData(80, 80);
  for (let j = 0; j < 80; j++) for (let i = 0; i < 80; i++) {
    const x = -R + (i + 0.5) / 80 * 2*R, y = R - (j + 0.5) / 80 * 2*R;
    const s = 1 / (1 + Math.exp(-(w1*x + w2*y + b)));
    const [r, g, bl] = cmap(s);
    const k = 4 * (j*80 + i);
    img.data[k] = r; img.data[k+1] = g; img.data[k+2] = bl; img.data[k+3] = 180;
  }
  hctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(heat, 0, 0, W, H);

  ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H); ctx.moveTo(0, py(0)); ctx.lineTo(W, py(0)); ctx.stroke();

  ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 6;
  ctx.beginPath();
  if (Math.abs(w2) > 1e-9) {
    ctx.moveTo(px(-R), py((-b + w1*R) / w2)); ctx.lineTo(px(R), py((-b - w1*R) / w2));
    ctx.stroke();
  } else if (Math.abs(w1) > 1e-9) {
    ctx.moveTo(px(-b / w1), 0); ctx.lineTo(px(-b / w1), H);
    ctx.stroke();
  }

  let wrong = 0;
  for (const p of pts) {
    const pred = (w1*p.x + w2*p.y + b) > 0 ? 1 : 0;
    const bad = pred !== p.c;
    if (bad) wrong++;
    ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 11, 0, 2*Math.PI);
    ctx.fillStyle = p.c ? "rgba(214,39,40,0.85)" : "rgba(31,119,180,0.85)";
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#000"; ctx.stroke();
    if (bad) {
      ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 19, 0, 2*Math.PI);
      ctx.lineWidth = 5; ctx.strokeStyle = "#000"; ctx.stroke();
    }
  }

  document.getElementById("v1").textContent = fmt(w1);
  document.getElementById("v2").textContent = fmt(w2);
  document.getElementById("vb").textContent = fmt(b);
  const sg = v => (v < 0 ? " − " : " + ") + fmt(Math.abs(v));
  document.getElementById("eq").textContent = fmt(w1) + " · x₁" + sg(w2) + " · x₂" + sg(b) + " = 0";
  const e = document.getElementById("err");
  e.textContent = wrong; e.style.color = wrong === 0 ? "var(--ok)" : "var(--bad)";
  document.getElementById("tot").textContent = pts.length;
  document.getElementById("acc").textContent = "Aciertos: " + Math.round(100 * (pts.length - wrong) / pts.length) + " %";
}

function set(v) { S.s1.value = v[0]; S.s2.value = v[1]; S.sb.value = v[2]; draw(); }
for (const k in S) S[k].addEventListener("input", draw);
document.getElementById("r0").onclick = () => set(INIT);
document.getElementById("r1").onclick = () => set([1.5, 1.0, -0.5]);
set(INIT);
</script>
</body>
</html>
